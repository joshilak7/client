<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#007bff" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="4kWfLWrBSbLrHZIEiVofjq-CcEvTNMLC1pprWIKbU3g"
    />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Dhwani Tourist - Best car rental and tour packages in India. Book affordable cars, taxis, and sightseeing tours. 24/7 customer support. Call +91 92747 13544"
    />
    <meta
      name="keywords"
      content="car rental India, taxi service, tour packages, sightseeing, Dhwani Tourist, car hire, outstation taxi, airport transfer, travel agency"
    />
    <meta name="author" content="Dhwani Tourist" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dhwanitourist.vercel.app/" />
    <meta
      property="og:title"
      content="Dhwani Tourist - Best Car Rental & Tour Packages"
    />
    <meta
      property="og:description"
      content="Book cars, taxis, and tour packages at best prices. Safe, reliable travel services across India."
    />
    <meta
      property="og:image"
      content="https://dhwanitourist.vercel.app/og-image.jpg"
    />
    <meta property="og:site_name" content="Dhwani Tourist" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dhwani Tourist - Best Car Rental & Tour Packages"
    />
    <meta
      name="twitter:description"
      content="Premium car rental and tour packages across India. Book now for best deals!"
    />
    <meta
      name="twitter:image"
      content="https://dhwanitourist.vercel.app/twitter-image.jpg"
    />

    <!-- Geo Tags for Local SEO -->
    <meta name="geo.region" content="IN-GJ" />
    <meta name="geo.placename" content="Ahmedabad, Gujarat" />
    <meta name="geo.position" content="23.0225;72.5714" />
    <meta name="ICBM" content="23.0225, 72.5714" />
    <!-- Google-specific meta tags -->
    <meta name="google" content="nositelinkssearchbox" />
    <meta name="google" content="notranslate" />

    <!-- Mobile-friendly -->
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />

    <!-- Content Security Policy (optional) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline';"
    />
    <!-- Canonical URL -->
    <link rel="canonical" href="https://dhwanitourist.vercel.app/" />

    <!-- Alternate Language Versions -->
    <link
      rel="alternate"
      href="https://dhwanitourist.vercel.app/"
      hreflang="en"
    />
    <link
      rel="alternate"
      href="https://dhwanitourist.vercel.app/hi"
      hreflang="hi"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preload critical assets -->
    <link rel="preload" href="%PUBLIC_URL%/logo192.png" as="image" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Dhwani Tourist",
        "url": "https://dhwanitourist.vercel.app",
        "logo": "https://dhwanitourist.vercel.app/logo.png",
        "description": "Best car rental and tour packages provider in India. Offering taxi services, sightseeing tours, and customized travel packages.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ahmedabad",
          "addressRegion": "Gujarat",
          "addressCountry": "India"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9274713544",
          "contactType": "customer service",
          "availableLanguage": ["English", "Hindi"]
        },
        "priceRange": "₹₹",
        "openingHours": "Mo-Su 00:00-23:59",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "1250"
        }
      }
    </script>

    <title>Dhwani Tourist - Best Car Rental & Tour Packages in India</title>
  </head>
  <body>
    <noscript
      >You need to enable JavaScript to run this app. Dhwani Tourist offers car
      rental and tour packages. Call +91 92747 13544</noscript
    >
    <div id="root"></div>
  </body>
</html>
